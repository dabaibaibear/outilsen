<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outils de texte | Outilsen</title>
<meta name="description" content="Compter caractères, majuscules, minuscules, nettoyer espaces">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.pub {border:1px dashed #ccc; padding:10px; text-align:center; color:#666; margin:1rem 0;}
</style>
</head>
<body class="bg-gray-50 font-roboto">
<div class="max-w-2xl mx-auto p-4 py-6">
  <a href="index.html" class="text-blue-600 underline">← Retour accueil</a>
  <h1 class="text-2xl font-bold mt-4 mb-2">Outils de texte</h1>
  <p class="text-sm text-green-700 mb-4">Tous les calculs s'exécutent dans votre navigateur, aucune donnée n'est transmise sur internet.</p>

  <div class="bg-white p-5 rounded-lg shadow">
    <div class="mb-4">
      <label class="block mb-1 font-medium">Votre texte</label>
      <textarea id="txt" rows="5" class="w-full border p-2 rounded" oninput="updateTxt()"></textarea>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-4">
      <button onclick="toUpper()" class="bg-gray-200 p-2 rounded">MAJUSCULES</button>
      <button onclick="toLower()" class="bg-gray-200 p-2 rounded">minuscules</button>
      <button onclick="trimAll()" class="bg-gray-200 p-2 rounded">Supprimer espaces</button>
      <button onclick="clearTxt()" class="bg-gray-200 p-2 rounded">Vider</button>
    </div>
    <div id="statTxt" class="p-3 bg-gray-100 rounded"></div>
  </div>

  <div class="pub mt-6">
    <span class="text-sm">Publicité (code AdSense ici)</span>
  </div>

  <footer class="mt-8 pt-6 border-t text-center text-sm text-gray-500">
    <a href="confidentialite.html" class="underline mx-2">Politique de confidentialité</a>
    <a href="mentions-legales.html" class="underline mx-2">Mentions légales</a>
  </footer>
</div>

<script>
const el = document.getElementById('txt');
function updateTxt(){
  const s = el.value;
  const car = s.length;
  const mots = s.trim()? s.trim().split(/\s+/).length : 0;
  document.getElementById('statTxt').innerHTML = `<p>Caractères : ${car} | Mots : ${mots}</p>`;
}
function toUpper(){ el.value = el.value.toUpperCase(); updateTxt(); }
function toLower(){ el.value = el.value.toLowerCase(); updateTxt(); }
function trimAll(){ el.value = el.value.replace(/\s+/g,' ').trim(); updateTxt(); }
function clearTxt(){ el.value = ''; updateTxt(); }
updateTxt();
</script>
</body>
</html>
