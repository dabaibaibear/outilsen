<body class="bg-gray-50 font-roboto">
<div class="max-w-2xl mx-auto p-4 py-6">
  <a href="index.html" class="text-blue-600 underline">← Retour accueil</a>
  <h1 class="text-2xl font-bold mt-4 mb-2">Calculateur Note BFEM</h1>
  <p class="text-sm text-green-700 mb-4">Tous les calculs s'exécutent dans votre navigateur, aucune donnée n'est transmise sur internet.</p>

  <div class="bg-white p-5 rounded-lg shadow">
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="block mb-1 font-medium">Note 1</label>
        <input type="number" id="n1" class="w-full border p-2 rounded" step="0.25">
      </div>
      <div>
        <label class="block mb-1 font-medium">Coefficient 1</label>
        <input type="number" id="c1" value="1" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block mb-1 font-medium">Note 2</label>
        <input type="number" id="n2" class="w-full border p-2 rounded" step="0.25">
      </div>
      <div>
        <label class="block mb-1 font-medium">Coefficient 2</label>
        <input type="number" id="c2" value="1" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block mb-1 font-medium">Note 3</label>
        <input type="number" id="n3" class="w-full border p-2 rounded" step="0.25">
      </div>
      <div>
        <label class="block mb-1 font-medium">Coefficient 3</label>
        <input type="number" id="c3" value="1" class="w-full border p-2 rounded">

        <input type="number" id="n4" class="w-full border p-2 rounded" step="0.25">

        <input type="number" id="c4" value="1" class="w-full border p-2 rounded">
      </div>
    </div>
    <button onclick="calculBFEM()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Calculer Moyenne Pondérée</button>

</div>

<script>
function calculBFEM(){
  const notes = [
    {n:parseFloat(document.getElementById('n1').value)||0, c:parseFloat(document.getElementById('c1').value)||0},
    {n:parseFloat(document.getElementById('n2').value)||0, c:parseFloat(document.getElementById('c2').value)||0},
    {n:parseFloat(document.getElementById('n3').value)||0, c:parseFloat(document.getElementById('c3').value)||0},
    {n:parseFloat(document.getElementById('n4').value)||0, c:parseFloat(document.getElementById('c4').value)||0},
  ];
  let sommeNote = 0, sommeCoef = 0;
  notes.forEach(item=>{
    sommeNote += item.n * item.c;
    sommeCoef += item.c;
  });
  const moy = sommeCoef>0 ? sommeNote / sommeCoef : 0;
  document.getElementById('resBFEM').innerHTML = `
    <p>Somme des notes pondérées : <strong>${sommeNote.toFixed(2)}</strong></p>
    <p>Somme des coefficients : <strong>${sommeCoef}</strong></p>
    <p>Moyenne : <strong>${moy.toFixed(2)}</strong></p>
  `;
}
</script>
