<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur TVA Sénégal | Outilsen</title>
<meta name="description" content="Calculateur TVA au Sénégal, taux 20%, calcul HT vers TTC et TTC vers HT.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.pub {border:1px dashed #ccc; padding:10px; text-align:center; color:#666; margin:1rem 0;}
</style>
</head>
<body class="bg-gray-50 font-roboto">
<div class="max-w-2xl mx-auto p-4 py-6">
  <a href="index.html" class="text-blue-600 underline">← Retour accueil</a>
  <h1 class="text-2xl font-bold mt-4 mb-2">Calculateur TVA Sénégal</h1>
  <p class="text-sm text-green-700 mb-4">Tous les calculs s'exécutent dans votre navigateur, aucune donnée n'est transmise sur internet.</p>

  <div class="bg-white p-5 rounded-lg shadow">
    <div class="mb-4">
      <label class="block mb-1 font-medium">Mode de calcul</label>
      <select id="mode" class="w-full border p-2 rounded">
        <option value="ht2ttc">HT → TTC (ajouter TVA)</option>
        <option value="ttc2ht">TTC → HT (retirer TVA)</option>
      </select>
    </div>
    <div class="mb-4">
      <label class="block mb-1 font-medium">Montant (XOF FCFA)</label>
      <input type="number" id="montant" class="w-full border p-2 rounded" placeholder="Ex: 10000">
    </div>
    <div class="mb-4">
      <label class="block mb-1 font-medium">Taux TVA (%)</label>
      <input type="number" id="taux" value="20" class="w-full border p-2 rounded">
    </div>
    <button onclick="calculer()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Calculer</button>
    <div id="resultat" class="mt-4 p-3 bg-gray-100 rounded"></div>
  </div>

  <div class="pub mt-6">
    <span class="text-sm">Publicité (code AdSense ici)</span>
  </div>

  <footer class="mt-8 pt-6 border-t text-center text-sm text-gray-500">
    <a href="confidentialite.html" class="underline mx-2">Politique de confidentialité</a>
    <a href="mentions-legales.html" class="underline mx-2">Mentions légales</a>
  </footer>
</div>

<script>
function calculer(){
  const mode = document.getElementById('mode').value;
  const montant = parseFloat(document.getElementById('montant').value) || 0;
  const taux = parseFloat(document.getElementById('taux').value)/100;
  let ht, ttc, tva;
  if(mode === 'ht2ttc'){
    ht = montant;
    tva = ht * taux;
    ttc = ht + tva;
  }else{
    ttc = montant;
    ht = ttc/(1+taux);
    tva = ttc - ht;
  }
  document.getElementById('resultat').innerHTML = `
    <p>HT : <strong>${ht.toFixed(2)} XOF</strong></p>
    <p>TVA : <strong>${tva.toFixed(2)} XOF</strong></p>
    <p>TTC : <strong>${ttc.toFixed(2)} XOF</strong></p>
  `;
}
</script>
</body>
</html>
