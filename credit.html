<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcul Mensualité Crédit | Outilsen</title>
<meta name="description" content="Simulation de mensualité de crédit pour commerçants au Sénégal">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.pub {border:1px dashed #ccc; padding:10px; text-align:center; color:#666; margin:1rem 0;}
</style>
</head>
<body class="bg-gray-50 font-roboto">
<div class="max-w-2xl mx-auto p-4 py-6">
  <a href="index.html" class="text-blue-600 underline">← Retour accueil</a>
  <h1 class="text-2xl font-bold mt-4 mb-2">Calculateur Mensualité Crédit</h1>
  <p class="text-sm text-green-700 mb-4">Tous les calculs s'exécutent dans votre navigateur, aucune donnée n'est transmise sur internet.</p>

  <div class="bg-white p-5 rounded-lg shadow">
    <div class="mb-4">
      <label class="block mb-1 font-medium">Montant emprunté (XOF)</label>
      <input type="number" id="cap" class="w-full border p-2 rounded" placeholder="500000">
    </div>
    <div class="mb-4">
      <label class="block mb-1 font-medium">Taux annuel (%)</label>
      <input type="number" id="tauxAnn" value="8" class="w-full border p-2 rounded" step="0.1">
    </div>
    <div class="mb-4">
      <label class="block mb-1 font-medium">Durée (mois)</label>
      <input type="number" id="duree" value="12" class="w-full border p-2 rounded">
    </div>
    <button onclick="calculCredit()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Simuler</button>
    <div id="resCredit" class="mt-4 p-3 bg-gray-100 rounded"></div>
  </div>

  <div class="pub mt-6">
    <span class="text-sm">Publicité (code AdSense ici)</span>
  </div>

  <footer class="mt-8 pt-6 border-t text-center text-sm text-gray-500">
    <a href="confidentialite.html" class="underline mx-2">Politique de confidentialité</a>
    <a href="mentions-legales.html" class="underline mx-2">Mentions légales</a>
  </footer>
</div>

<script>
function calculCredit(){
  const cap = parseFloat(document.getElementById('cap').value)||0;
  const tauxAnn = parseFloat(document.getElementById('tauxAnn').value)/100;
  const duree = parseInt(document.getElementById('duree').value)||1;
  const tm = tauxAnn / 12;
  let mens;
  if(tm === 0){
    mens = cap / duree;
  }else{
    mens = cap * tm * Math.pow(1+tm, duree) / (Math.pow(1+tm, duree)-1);
  }
  const total = mens * duree;
  const interet = total - cap;
  document.getElementById('resCredit').innerHTML = `
    <p>Mensualité : <strong>${mens.toFixed(2)} XOF</strong></p>
    <p>Total remboursé : <strong>${total.toFixed(2)} XOF</strong></p>
    <p>Intérêts total : <strong>${interet.toFixed(2)} XOF</strong></p>
    <p class="text-xs text-gray-500 mt-2">Valeur indicative, pas une offre bancaire</p>
  `;
}
</script>
</body>
</html>
