<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertisseur d'unités | Outilsen</title>
<meta name="description" content="Convertisseur longueur, masse, volume, XOF EUR USD pour le Sénégal">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.pub {border:1px dashed #ccc; padding:10px; text-align:center; color:#666; margin:1rem 0;}
</style>
</head>
<body class="bg-gray-50 font-roboto">
<div class="max-w-2xl mx-auto p-4 py-6">
  <a href="index.html" class="text-blue-600 underline">← Retour accueil</a>
  <h1 class="text-2xl font-bold mt-4 mb-2">Convertisseur d'unités & devises</h1>
  <p class="text-sm text-green-700 mb-4">Tous les calculs s'exécutent dans votre navigateur, aucune donnée n'est transmise sur internet.</p>

  <div class="bg-white p-5 rounded-lg shadow">
    <div class="mb-4">
      <label class="block mb-1 font-medium">Catégorie</label>
      <select id="cat" class="w-full border p-2 rounded" onchange="changerCat()">
        <option value="longueur">Longueur</option>
        <option value="masse">Masse</option>
        <option value="devise">Devise (XOF/EUR/USD)</option>
      </select>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="block mb-1 font-medium">De</label>
        <select id="unite1" class="w-full border p-2 rounded"></select>
      </div>
      <div>
        <label class="block mb-1 font-medium">Vers</label>
        <select id="unite2" class="w-full border p-2 rounded"></select>
      </div>
    </div>
    <div class="mb-4">
      <label class="block mb-1 font-medium">Valeur</label>
      <input type="number" id="val" class="w-full border p-2 rounded" placeholder="10">
    </div>
    <button onclick="convertir()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Convertir</button>
    <div id="resConv" class="mt-4 p-3 bg-gray-100 rounded"></div>
  </div>

  <div class="pub mt-6">
    <span class="text-sm">Publicité (code AdSense ici)</span>
  </div>

  <footer class="mt-8 pt-6 border-t text-center text-sm text-gray-500">
    <a href="confidentialite.html" class="underline mx-2">Politique de confidentialité</a>
    <a href="mentions-legales.html" class="underline mx-2">Mentions légales</a>
  </footer>
</div>

<script>
const data = {
  longueur: {options:["m","km","cm","mm"], base:{m:1,km:1000,cm:0.01,mm:0.001}},
  masse: {options:["kg","g","tonne"], base:{kg:1,g:0.001,tonne:1000}},
  devise: {options:["XOF","EUR","USD"], base:{XOF:1, EUR:655.957, USD:580}}
};
function changerCat(){
  const cat = document.getElementById('cat').value;
  const arr = data[cat].options;
  const u1 = document.getElementById('unite1');
  const u2 = document.getElementById('unite2');
  u1.innerHTML = ''; u2.innerHTML = '';
  arr.forEach(x=>{
    u1.innerHTML += `<option value="${x}">${x}</option>`;
    u2.innerHTML += `<option value="${x}">${x}</option>`;
  })
  u2.selectedIndex = 1;
}
function convertir(){
  const cat = document.getElementById('cat').value;
  const u1 = document.getElementById('unite1').value;
  const u2 = document.getElementById('unite2').value;
  const val = parseFloat(document.getElementById('val').value)||0;
  const base = data[cat].base;
  const enBase = val * base[u1];
  const res = enBase / base[u2];
  document.getElementById('resConv').innerHTML = `<p>Résultat : <strong>${res.toFixed(2)} ${u2}</strong></p>`;
}
changerCat();
</script>
</body>
</html>
